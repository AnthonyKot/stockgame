<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockgame case</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>
<div class="wrap">
  <div id="head" class="card" role="region" aria-label="Decision header">Loading…</div>
  <div id="debrief"></div>
  <div class="grid">
    <div id="main"></div>
    <aside id="ticket" class="ticket" aria-label="Decision ticket"></aside>
  </div>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Evidence"></aside>
<script src="app.js"></script>
<script src="sim.js"></script>
<script src="story.js"></script>
<script>
(async () => {
  const { $, el, load, prose, money, pct, signed, dateFmt, horizonText, badge } = SG;
  const params = new URLSearchParams(location.search); const id = params.get('case');
  const campaignMode = params.get('mode') === 'campaign';   // embedded in campaign.html: no topbar, no ticket, no journal, no reveal; the campaign page owns the decision
  if (campaignMode) { document.body.classList.add('embedded'); document.getElementById('top').remove(); } else document.getElementById('top').replaceWith(SG.topbar('play', () => openRules()));
  const head = $('#head'), main = $('#main'), ticket = $('#ticket'), debrief = $('#debrief'), drawer = $('#drawer'), backdrop = $('#backdrop');
  if (!id) { head.textContent = 'No case selected.'; return; }
  let sheet, market, reveal = null, outcome = null, walkExit = null;   // walkExit: simulated early exit (stop/target) that ends the walk before the anniversary
  try { [sheet, market] = await Promise.all([load(`data/${id}/sheet.json`), load(`data/${id}/market.json`)]); } catch (e) { head.textContent = 'Could not load this case: ' + e.message; return; }
  const prior = campaignMode ? null : SG.findCommit(id);
  const transparent = campaignMode ? false : SG.transparent();
  if (transparent || prior) { try { reveal = await load(`data/${id}/reveal.json`); } catch (e) { reveal = null; } }
  const walkPending = prior && !prior.walkthrough_complete && !prior.walkthrough_skipped && !prior.result;   // identity stays hidden until the walk is done or skipped
  const name = reveal && (transparent || (prior && !walkPending)) ? `${reveal.transparent.issuer} (${reveal.transparent.ticker})` : sheet.masked.alias;
  const headName = el('strong', {}, name);
  const revealHeader = () => { if (reveal) headName.textContent = `${reveal.transparent.issuer} (${reveal.transparent.ticker})`; };
  const years = Number(sheet.horizon.count);

  /* ---------- evidence drawer ---------- */
  const claims = new Map((sheet.claims || []).map(c => [c.id, c]));
  const handles = new Map((sheet.source_handles || []).map(s => [s.id, s]));
  function openDrawer(cid) {
    const c = claims.get(cid); drawer.innerHTML = '';
    drawer.append(el('div', { class: 'row' }, el('h2', { style: 'margin:0;flex:1' }, 'Evidence ' + cid), el('button', { class: 'ghost', type: 'button', onclick: closeDrawer }, 'Close')));
    if (!c) { drawer.append(el('p', { class: 'muted' }, 'No claim record for this id (writer omitted it). Treat the sentence as unverified.')); }
    else {
      drawer.append(el('p', {}, c.text, ' ', badge(c.status)));
      if (c.formula) drawer.append(el('p', { class: 'note' }, 'Formula: ' + c.formula + (c.input_ids ? ' from ' + c.input_ids.join(', ') : '')));
      const ul = el('ul', { class: 'plain' });
      for (const sid of c.source_ids || []) { const h = handles.get(sid); const rs = reveal && reveal.sources.find(s => s.id === sid);
        ul.append(el('li', {}, el('div', {}, (rs ? rs.title : (h ? h.masked_title || h.title : sid)), ' ', el('span', { class: 'muted' }, h ? h.kind + ' · public ' + dateFmt(h.available_at) : '')),
          rs && rs.url ? el('div', {}, el('a', { href: rs.url, target: '_blank', rel: 'noopener' }, rs.url)) : el('div', { class: 'note' }, (h && h.availability_basis ? 'Public: ' + h.availability_basis + '. ' : '') + 'Original link shown after you commit.'),
          ...(((rs ? rs.excerpts : (h ? h.excerpts : null)) || []).filter(x => (x.claim_ids || []).includes(cid)).map(x => el('blockquote', { class: 'note', style: 'margin:.3rem 0 .3rem .5rem' }, '“' + x.text + '” — ' + (x.location || '')))))); }
      drawer.append(el('h3', { style: 'font-size:.9rem' }, 'Sources'), ul);
    }
    drawer.hidden = false; backdrop.hidden = false; drawer.querySelector('button').focus();
  }
  function openRules() { drawer.innerHTML = ''; drawer.append(el('div', { class: 'row' }, el('span', { style: 'flex:1' }), el('button', { class: 'ghost', type: 'button', onclick: closeDrawer }, 'Close'))); const s = SG.rulesSection(); s.style.marginTop = '0'; s.classList.remove('card'); drawer.append(s); drawer.hidden = false; backdrop.hidden = false; drawer.querySelector('button').focus(); }
  function closeDrawer() { drawer.hidden = true; backdrop.hidden = true; }
  backdrop.onclick = closeDrawer; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  const P = t => prose(t, openDrawer);

  /* ---------- header: identity line + stats, rendered lower on the page (see 'Where the stock stands') ---------- */
  head.remove();
  const statsCard = el('section', { class: 'card' }, el('h2', {}, 'Where the stock stands', el('small', {}, 'at the last close before the cutoff')));
  statsCard.append(el('div', { style: 'margin-bottom:.4rem' }, headName, ' · ', sheet.masked.sector));
  statsCard.append(el('div', { class: 'kv' },
    el('div', {}, el('div', { class: 'l' }, '1 month'), el('div', { class: 'v ' + (market.returns['1m'] >= 0 ? 'up' : 'down') }, signed(market.returns['1m'])), el('div', { class: 'p' }, 'SPY ' + signed(market.spy_returns['1m']))),
    el('div', {}, el('div', { class: 'l' }, '3 months'), el('div', { class: 'v ' + (market.returns['3m'] >= 0 ? 'up' : 'down') }, signed(market.returns['3m'])), el('div', { class: 'p' }, 'SPY ' + signed(market.spy_returns['3m']))),
    el('div', {}, el('div', { class: 'l' }, '12 months'), el('div', { class: 'v ' + (market.returns['12m'] >= 0 ? 'up' : 'down') }, signed(market.returns['12m'])), el('div', { class: 'p' }, 'SPY ' + signed(market.spy_returns['12m']))),
    el('div', {}, el('div', { class: 'l' }, 'From 12-month high'), el('div', { class: 'v' }, signed(market.distance_from_trailing_252_high)), el('div', { class: 'p' }, 'closing basis'))));

  /* ---------- blocks ---------- */
  const card = (title, sub, ...kids) => el('section', { class: 'card' }, el('h2', {}, title, sub ? el('small', {}, sub) : null), ...kids);
  /* opening scene: a setup written from the packet (cases/scenes.json), plus real dated headlines */
  let instinct = null; const askedQ = new Set();
  const heads = (sheet.source_handles || []).filter(h => h.masked_headline && h.available_at && h.available_at <= sheet.cutoff.slice(0, 10) && !/xbrl|company facts/i.test(h.masked_headline)).sort((a, b) => b.available_at.localeCompare(a.available_at)).slice(0, 3);
  const sc = sheet.scene; let sceneRead = !!sc;
  if (sc) {
    const scene = el('section', { class: 'card scene' }, el('h2', {}, 'Morning of ' + dateFmt(sheet.cutoff) + ' · ' + sc.setup_label, el('small', {}, `built for a ${years}-year hold; you choose the horizon when you decide`)));
    const q = el('p', { style: 'font-size:1.02rem;margin:.6rem 0 0' }, sc.question);
    if (sc.setup === 'bad_news_headline') scene.append(el('blockquote', { style: 'margin:.4rem 0;padding:.5rem .8rem;border-left:3px solid var(--s2);font-weight:600' }, sc.voice));
    else if (sc.setup === 'analysts_disagree') { const parts = sc.voice.split(/\s(?=The other:)/); scene.append(el('p', {}, el('em', {}, parts[0])), parts[1] ? el('p', {}, el('em', {}, parts[1])) : null); }
    else scene.append(el('p', {}, el('em', {}, '“' + sc.voice + '”')));
    scene.append(q);
    if (heads.length) scene.append(el('details', {}, el('summary', { class: 'note' }, 'Headlines on your phone from the past weeks'), el('ul', { class: 'plain' }, ...heads.map(h => el('li', { class: 'note' }, el('span', { class: 'muted' }, dateFmt(h.available_at) + ' · '), h.masked_headline.replace(/\s*\(.*?(exhibit|accession).*?\)/i, ''))))));
    if ((sc.ask_friend || []).length) {
      const askBox = el('div', { style: 'margin-top:.6rem' }, el('div', { class: 'note' }, el('strong', {}, sc.ask_label || 'What would you ask your friend?')));
      const row = el('div', { class: 'row', style: 'margin:.3rem 0' }); const ans = el('div');
      sc.ask_friend.forEach((qa, i) => row.append(el('button', { type: 'button', class: 'ghost', 'aria-expanded': 'false', onclick: e => { const open = e.currentTarget.getAttribute('aria-expanded') === 'true'; [...row.children].forEach(b => b.setAttribute('aria-expanded', 'false')); ans.innerHTML = ''; if (!open) { e.currentTarget.setAttribute('aria-expanded', 'true'); ans.append(el('div', { class: 'card', style: 'margin:.4rem 0 0;background:var(--surface)' }, el('p', { style: 'margin:0' }, P(qa.a)))); askedQ.add(i); } } }, qa.q)));
      askBox.append(row, ans); scene.append(askBox);
    }
    const inst = el('div', { style: 'margin-top:.6rem' }, el('div', { class: 'note' }, el('strong', {}, 'Your first reaction')));
    const irow = el('div', { class: 'row', role: 'group', 'aria-label': 'First reaction' });
    const preset = { interested: ['buy', '5'], unconvinced: ['skip', null], against: ['short', '5'] };   // pre-fills the ticket; the player can change it
    for (const [k, lab] of [['interested', 'Interested'], ['unconvinced', 'Unconvinced'], ['against', 'Against it']]) irow.append(el('button', { type: 'button', class: 'ghost', 'aria-pressed': 'false', onclick: e => { instinct = k; [...irow.children].forEach(b => b.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true');
      const [act, sz] = preset[k]; const a = ticket.querySelector(`input[name=action][value=${act}]`); if (a) { a.checked = true; a.dispatchEvent(new Event('change')); } if (sz) { const s = ticket.querySelector(`input[name=size][value="${sz}"]`); if (s) s.checked = true; } } }, lab));
    inst.append(irow); scene.append(inst);
    scene.append(el('p', { class: 'note' }, 'The friend and the scene are fiction; every factual clause comes from this packet. Check it below before you decide; the debrief will tell you which of its claims held.'));
    main.append(scene);
  }

  /* the question first */
  const wc0 = (sheet.what_changed || [])[0];
  main.append(el('section', { class: 'card', style: 'border-left:4px solid var(--s1)' },
    el('h2', { style: 'font-size:1.15rem' }, sheet.neutral_title || 'The decision'),
    sc ? null : el('p', { style: 'font-size:1.02rem' }, P(sheet.player_question || '')),
    wc0 ? el('p', { class: 'note' }, el('strong', {}, 'Why now: '), P(wc0.fact)) : null,
    el('p', { class: 'note' }, 'Everything below was public before ', dateFmt(sheet.cutoff), ' 09:00 New York. Horizon ', horizonText(sheet.horizon), '. Read as much or as little as you need, then decide on the right.')));
  main.append(card('Business', null, el('p', {}, P((transparent || (prior && !walkPending)) && reveal ? reveal.transparent.business_two_sentences : sheet.masked.business_two_sentences))));

  /* market chart */
  const chartHost = el('div'); let span = years >= 3 ? 36 : 12;
  const spanBtns = el('div', { class: 'row', role: 'group', 'aria-label': 'Chart span' });
  const drawMarket = () => { const cut = new Date(market.last_eligible_session + 'T00:00:00Z'); cut.setUTCMonth(cut.getUTCMonth() - span); const from = cut.toISOString().slice(0, 10);
    const bars = market.bars.filter(b => b.d >= from), spy = market.spy.filter(b => b.d >= from);
    SG.lineChart(chartHost, [{ name: 'This stock', cls: 's1', points: bars.map(b => ({ d: b.d, v: b.c })) }, { name: 'SPY', cls: 's2', points: spy.map(b => ({ d: b.d, v: b.c })) }], { controls: true, rebase: true, volume: bars.map(b => ({ d: b.d, v: b.v })), label: 'Price indexed to 100 at the start of the window, with SPY, ending at the cutoff', rawFmt: r => '$' + r.toFixed(2) }); };
  for (const m of [12, 36]) spanBtns.append(el('button', { class: 'ghost', type: 'button', 'aria-pressed': span === m ? 'true' : 'false', onclick: e => { span = m; [...spanBtns.children].forEach(b => b.setAttribute('aria-pressed', 'false')); e.target.setAttribute('aria-pressed', 'true'); drawMarket(); } }, m === 12 ? '12 months' : '3 years'));
  const lastClose = el('div', { class: 'row', style: 'gap:.75rem;margin:.75rem 0;align-items:baseline' },
    el('span', { class: 'note' }, 'Last eligible close'),
    el('strong', { style: 'font-size:1.4rem;font-variant-numeric:tabular-nums' }, '$' + market.last_close.toFixed(2)),
    el('span', { class: 'note' }, dateFmt(market.last_eligible_session)));
  main.append(card('Market snapshot', 'ends at the cutoff', lastClose, spanBtns, chartHost, el('p', { class: 'note' }, market.level_note + ' ' + market.coverage_note)));
  main.append(statsCard);
  drawMarket();

  /* what changed */
  main.append(card('What changed', 'material items public before the cutoff', el('ul', { class: 'plain' }, ...(sheet.what_changed || []).map(w => el('li', {}, el('strong', {}, dateFmt(w.date)), ' ', badge(w.status), el('div', {}, P(w.fact)), el('div', { class: 'note' }, P(w.relationship_to_business)))))));

  /* financial snapshot */
  const fs = sheet.financial_snapshot || {}; const kv = el('div', { class: 'kv' });
  for (const h of fs.headline || []) kv.append(el('div', {}, el('div', { class: 'l' }, h.label, ' ', badge(h.status)), el('div', { class: 'v' }, h.value === null || h.value === undefined ? 'not available' : money(h.value, h.unit)), el('div', { class: 'p' }, (h.period ? 'period ' + h.period : '') + (h.prior && h.prior.value !== null && h.prior.value !== undefined ? ' · prior ' + money(h.prior.value, h.unit) + ' (' + h.prior.period + ')' : '') + (h.available_at ? ' · public ' + dateFmt(h.available_at) : '')), h.definition ? el('details', {}, el('summary', { class: 'note' }, 'definition'), el('div', { class: 'note' }, h.definition)) : null));
  const hist = el('table'); const histWrap = el('div');
  if ((fs.history || []).length) {
    const periods = [...new Set(fs.history.flatMap(r => r.cells.map(c => c.period)))];
    const isAnnual = per => /^FY\s?\d{4}|^\d{4}$|full[- ]year|^TTM|^LTM/i.test(String(per)); const isQuarter = per => /^Q[1-4]|quarter|^\dQ|9M|nine|6M|H[12]/i.test(String(per));
    const mixed = periods.some(isAnnual) && periods.some(isQuarter);
    const isStockRow = r => /cash|debt|share|assets|equity|investment|liabilit|deposit|loan|receivable|inventory|backlog|book value|balance/i.test(r.row);
    let perQuarter = mixed;
    const drawHist = () => { hist.innerHTML = '';
      hist.append(el('tr', {}, el('th', {}, 'Row'), ...periods.map(p => el('th', { class: 'n' }, p + (perQuarter && isAnnual(p) ? ' ÷4' : '')))));
      for (const r of fs.history) { const stock = isStockRow(r);
        hist.append(el('tr', {}, el('td', {}, r.row, ' ', el('span', { class: 'muted' }, (r.unit || '') + (perQuarter && !stock ? '' : (perQuarter && stock ? ' · point in time' : '')))), ...periods.map(p => { const c = r.cells.find(x => x.period === p); if (!c) return el('td', { class: 'n' }, '');
          let v = c.value; const conv = perQuarter && isAnnual(p) && !stock && typeof v === 'number'; if (conv) v = v / 4;
          return el('td', { class: 'n', title: 'public ' + (c.available_at || '?') + ' · ' + (c.status || '') + ' · ' + (c.source_ids || []).join(', ') + (conv ? ' · annual figure divided by 4' : '') }, v === null || v === undefined ? '—' : (typeof v === 'number' ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : v)); }))); } };
    drawHist();
    if (location.hash === '#hist') setTimeout(() => { const d = histWrap.closest('details'); if (d) { d.open = true; d.scrollIntoView(); } }, 300);
    if (mixed) histWrap.append(el('label', { class: 'note', style: 'display:block;margin:.3rem 0' }, el('input', { type: 'checkbox', checked: '', onchange: e => { perQuarter = e.target.checked; drawHist(); } }), ' Show annual columns as a per-quarter average (÷4) so they compare with the quarters; balance-sheet rows are left as reported'));
    histWrap.append(el('div', { class: 'scroll' }, hist));
  }
  const V = sheet.valuation || {}; const vkv = el('div', { class: 'kv', style: 'margin-top:.75rem' });
  const m = x => x === null || x === undefined ? 'not derived' : (Math.abs(x) >= 1000 ? '$' + (x / 1000).toFixed(1) + ' bn' : '$' + x.toFixed(0) + ' m');
  if (V.status === 'derived') {
    vkv.append(el('div', {}, el('div', { class: 'l' }, 'Market capitalization ', badge('derived')), el('div', { class: 'v' }, m(V.market_cap_musd)), el('div', { class: 'p' }, V.market_cap_formula)));
    if (V.enterprise_value_musd !== undefined) vkv.append(el('div', {}, el('div', { class: 'l' }, 'Enterprise value ', badge('derived')), el('div', { class: 'v' }, m(V.enterprise_value_musd)), el('div', { class: 'p' }, 'market cap ' + (V.net_cash_musd >= 0 ? 'minus net cash of ' : 'plus net debt of ') + m(Math.abs(V.net_cash_musd)))));
    if (V.annual_revenue_musd) vkv.append(el('div', {}, el('div', { class: 'l' }, (V.ev_to_revenue !== undefined ? 'EV / annual revenue ' : 'Market cap / annual revenue '), badge('derived')), el('div', { class: 'v' }, (V.ev_to_revenue !== undefined ? V.ev_to_revenue : V.market_cap_to_revenue) + 'x'), el('div', { class: 'p' }, 'revenue ' + m(V.annual_revenue_musd) + ', last full year filed before the cutoff')));
  }
  const vdet = el('details', {}, el('summary', { class: 'note' }, 'Valuation inputs and caveats'), el('ul', { class: 'plain' }, ...(V.inputs || []).map(i => el('li', { class: 'note' }, `${i.name}: ${i.value_millions !== undefined ? (i.name === 'shares' ? i.value_millions.toFixed(1) + ' m shares' : m(i.value_millions)) : ''} as of ${i.as_of || i.period || ''}${i.filed ? ', filed ' + i.filed : ''}${i.source ? ' [' + (Array.isArray(i.source) ? i.source.join(', ') : i.source) + ']' : ''}`)), ...(V.caveats || []).map(c => el('li', { class: 'note' }, 'Caveat: ' + c)), el('li', { class: 'note' }, V.note || V.reason || '')));
  if (fs.presentation) {
    const presentation = fs.presentation;
    const snapshot = card('Financial snapshot', null, el('p', { class: 'note' }, presentation.intro));
    snapshot.classList.add('financial-snapshot');
    const periodLabel = value => /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? 'As of ' + dateFmt(value) : String(value || '').replace(/^Q([1-4])-(\d{4})$/, 'Q$1 $2').replace(/^9M-(\d{4})$/, 'Jan–Sep $1');
    const compactMoney = (value, unit) => money(value, unit).replace(/\$-/, '-$').replace(/ (m|bn|tn)$/, '$1');
    for (const group of presentation.groups) {
      const section = el('section', { class: 'snapshot-group', 'aria-label': group.title }, el('h3', {}, group.title));
      for (const index of group.metrics) {
        const view = presentation.metrics[index];
        const h = view && fs.headline.find(metric => metric.label === view.metric);
        if (!h || !view) continue;
        const prior = h.prior && h.prior.value !== null && h.prior.value !== undefined;
        const row = el('div', { class: 'snapshot-row' },
          el('div', { class: 'snapshot-label' }, el('strong', {}, view.label), el('span', { class: 'note' }, periodLabel(h.period))),
          el('div', { class: 'snapshot-number' }, el('strong', {}, view.display_value || compactMoney(h.value, h.unit)),
            prior && view.prior_comparable !== false ? el('span', { class: 'note' }, 'vs ' + compactMoney(h.prior.value, h.unit) + ' · ' + periodLabel(h.prior.period)) : null),
          el('p', { class: 'snapshot-context' }, view.context));
        const detail = el('details', { class: 'snapshot-detail' }, el('summary', {}, view.label + ': definition & source'),
          el('p', { class: 'note' }, h.status + ' · published ' + dateFmt(h.available_at) + ' · ' + h.label),
          el('p', { class: 'note' }, 'Exact displayed amount: ' + money(h.value, h.unit)), el('p', { class: 'note' }, P(h.definition || '')));
        if (prior && view.prior_comparable === false) detail.append(el('p', { class: 'note' }, 'Non-comparable prior: ' + compactMoney(h.prior.value, h.unit) + ' (' + periodLabel(h.prior.period) + ').'));
        for (const sid of h.source_ids || []) { const source = handles.get(sid); if (source) detail.append(el('p', { class: 'note' }, source.masked_title || source.title || sid, ' · public ' + dateFmt(source.available_at))); }
        row.append(detail); section.append(row);
      }
      snapshot.append(section);
    }
    vkv.className = 'snapshot-valuations';
    // valuation_mode (authored): 'pipeline' hides the revenue multiple (kept under the fold) and shows net cash as a share of market cap; 'revenue' keeps the multiple; 'bank' is market cap only
    const vmode = presentation.valuation_mode || 'revenue';
    if (vmode === 'pipeline' && V.status === 'derived') {
      const rev = [...vkv.children].find(t => /revenue/i.test(t.querySelector('.l').textContent));
      if (rev) { vdet.querySelector('ul').append(el('li', { class: 'note' }, 'Revenue multiple set aside: ' + rev.querySelector('.l').textContent.replace(/derived/, '').trim() + ' ' + Number(V.ev_to_revenue !== undefined ? V.ev_to_revenue : V.market_cap_to_revenue).toFixed(1) + '× on ' + m(V.annual_revenue_musd) + ' of last-full-year revenue; not a useful gauge for a company valued on its pipeline.')); rev.remove(); }
      if (V.market_cap_musd && typeof V.net_cash_musd === 'number') vkv.append(el('div', {}, el('div', { class: 'l' }, 'Net cash / market cap'), el('div', { class: 'v' }, (100 * V.net_cash_musd / V.market_cap_musd).toFixed(1) + '%')));
    }
    const valuationGroup = el('section', { class: 'snapshot-group snapshot-price' }, el('h3', {}, vmode === 'pipeline' ? 'What the market pays for the pipeline' : 'What the market is pricing'), el('p', { class: 'note' }, 'At the ' + dateFmt(V.as_of_price_date) + ' close · estimates derived from the available filings'), vkv, el('p', { class: 'note' }, presentation.valuation_context), vdet);
    // Keep the valuation inputs auditable without making formulas the main reading path.
    for (const tile of vkv.children) {
      const formula = tile.querySelector('.p');
      if (formula) { vdet.append(el('p', { class: 'note' }, formula.textContent)); formula.remove(); }
      const status = tile.querySelector('.badge'); if (status) status.remove();
      const number = tile.querySelector('.v'); if (number) number.textContent = number.textContent.replace(/ (bn|m|tn)$/, '$1').replace(/^(\d+\.\d+)x$/, (_, x) => Number(x).toFixed(1) + '×');
    }
    snapshot.append(valuationGroup, el('details', { class: 'snapshot-history' }, el('summary', {}, 'Full financial history'), histWrap));
    main.append(snapshot);
  } else {
    main.append(card('Financial snapshot', (fs.adapter || '').replace('_', ' '), kv, el('h3', { style: 'font-size:.9rem;margin:.75rem 0 0' }, 'Valuation at the cutoff'), vkv, vdet, el('details', { style: 'margin-top:.5rem' }, el('summary', {}, 'Supporting history (hover a cell for its publication date and source)'), histWrap)));
  }
