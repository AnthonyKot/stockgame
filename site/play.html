<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockgame case</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>
<div class="wrap">
  <div id="head" class="card" role="region" aria-label="Decision header">Loading…</div>
  <div id="debrief"></div>
  <div class="grid">
    <div id="main"></div>
    <aside id="ticket" class="ticket" aria-label="Decision ticket"></aside>
  </div>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Evidence"></aside>
<script src="app.js"></script>
<script src="sim.js"></script>
<script src="story.js"></script>
<script>
(async () => {
  const { $, el, load, prose, money, pct, signed, dateFmt, horizonText, badge } = SG;
  const params = new URLSearchParams(location.search); const id = params.get('case');
  const campaignMode = params.get('mode') === 'campaign';   // embedded in campaign.html: no topbar, no ticket, no journal, no reveal; the campaign page owns the decision
  if (campaignMode) { document.body.classList.add('embedded'); document.getElementById('top').remove(); } else document.getElementById('top').replaceWith(SG.topbar('play', () => openRules()));
  const head = $('#head'), main = $('#main'), ticket = $('#ticket'), debrief = $('#debrief'), drawer = $('#drawer'), backdrop = $('#backdrop');
  if (!id) { head.textContent = 'No case selected.'; return; }
  let sheet, market, reveal = null, outcome = null, walkExit = null;   // walkExit: simulated early exit (stop/target) that ends the walk before the anniversary
  try { [sheet, market] = await Promise.all([load(`data/${id}/sheet.json`), load(`data/${id}/market.json`)]); } catch (e) { head.textContent = 'Could not load this case: ' + e.message; return; }
  const prior = campaignMode ? null : SG.findCommit(id);
  const transparent = campaignMode ? false : SG.transparent();
  if (transparent || prior) { try { reveal = await load(`data/${id}/reveal.json`); } catch (e) { reveal = null; } }
  const walkPending = prior && !prior.walkthrough_complete && !prior.walkthrough_skipped && !prior.result;   // identity stays hidden until the walk is done or skipped
  const name = reveal && (transparent || (prior && !walkPending)) ? `${reveal.transparent.issuer} (${reveal.transparent.ticker})` : sheet.masked.alias;
  const headName = el('strong', {}, name);
  const revealHeader = () => { if (reveal) headName.textContent = `${reveal.transparent.issuer} (${reveal.transparent.ticker})`; };
  const years = Number(sheet.horizon.count);

  /* ---------- evidence drawer ---------- */
  const claims = new Map((sheet.claims || []).map(c => [c.id, c]));
  const handles = new Map((sheet.source_handles || []).map(s => [s.id, s]));
  function openDrawer(cid) {
    const c = claims.get(cid); drawer.innerHTML = '';
    drawer.append(el('div', { class: 'row' }, el('h2', { style: 'margin:0;flex:1' }, 'Evidence ' + cid), el('button', { class: 'ghost', type: 'button', onclick: closeDrawer }, 'Close')));
    if (!c) { drawer.append(el('p', { class: 'muted' }, 'No claim record for this id (writer omitted it). Treat the sentence as unverified.')); }
    else {
      drawer.append(el('p', {}, c.text, ' ', badge(c.status)));
      if (c.formula) drawer.append(el('p', { class: 'note' }, 'Formula: ' + c.formula + (c.input_ids ? ' from ' + c.input_ids.join(', ') : '')));
      const ul = el('ul', { class: 'plain' });
      for (const sid of c.source_ids || []) { const h = handles.get(sid); const rs = reveal && reveal.sources.find(s => s.id === sid);
        ul.append(el('li', {}, el('div', {}, (rs ? rs.title : (h ? h.masked_title || h.title : sid)), ' ', el('span', { class: 'muted' }, h ? h.kind + ' · public ' + dateFmt(h.available_at) : '')),
          rs && rs.url ? el('div', {}, el('a', { href: rs.url, target: '_blank', rel: 'noopener' }, rs.url)) : el('div', { class: 'note' }, (h && h.availability_basis ? 'Public: ' + h.availability_basis + '. ' : '') + 'Original link shown after you commit.'),
          ...(((rs ? rs.excerpts : (h ? h.excerpts : null)) || []).filter(x => (x.claim_ids || []).includes(cid)).map(x => el('blockquote', { class: 'note', style: 'margin:.3rem 0 .3rem .5rem' }, '“' + x.text + '” — ' + (x.location || '')))))); }
      drawer.append(el('h3', { style: 'font-size:.9rem' }, 'Sources'), ul);
    }
    drawer.hidden = false; backdrop.hidden = false; drawer.querySelector('button').focus();
  }
  function openRules() { drawer.innerHTML = ''; drawer.append(el('div', { class: 'row' }, el('span', { style: 'flex:1' }), el('button', { class: 'ghost', type: 'button', onclick: closeDrawer }, 'Close'))); const s = SG.rulesSection(); s.style.marginTop = '0'; s.classList.remove('card'); drawer.append(s); drawer.hidden = false; backdrop.hidden = false; drawer.querySelector('button').focus(); }
  function closeDrawer() { drawer.hidden = true; backdrop.hidden = true; }
  backdrop.onclick = closeDrawer; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  const P = t => prose(t, openDrawer, true);
  const Psubtle = P;

  /* ---------- header: identity line + stats, rendered lower on the page (see 'Where the stock stands') ---------- */
  head.remove();
  const statsCard = el('section', { class: 'card' }, el('h2', {}, 'Where the stock stands', el('small', {}, 'trailing returns to cutoff')));
  statsCard.append(el('div', { class: 'note', style: 'margin-bottom:.45rem' }, headName, ' · ', sheet.masked.sector));
  statsCard.append(el('div', { class: 'kv' },
    el('div', {}, el('div', { class: 'l' }, '1 month'), el('div', { class: 'v ' + (market.returns['1m'] >= 0 ? 'up' : 'down') }, signed(market.returns['1m'])), el('div', { class: 'p' }, 'S&P 500 ' + signed(market.spy_returns['1m']))),
    el('div', {}, el('div', { class: 'l' }, '3 months'), el('div', { class: 'v ' + (market.returns['3m'] >= 0 ? 'up' : 'down') }, signed(market.returns['3m'])), el('div', { class: 'p' }, 'S&P 500 ' + signed(market.spy_returns['3m']))),
    el('div', {}, el('div', { class: 'l' }, '12 months'), el('div', { class: 'v ' + (market.returns['12m'] >= 0 ? 'up' : 'down') }, signed(market.returns['12m'])), el('div', { class: 'p' }, 'S&P 500 ' + signed(market.spy_returns['12m']))),
    el('div', {}, el('div', { class: 'l' }, 'Vs. 12-month high'), el('div', { class: 'v' }, signed(market.distance_from_trailing_252_high)), el('div', { class: 'p' }, 'from 52-week peak'))));

  /* ---------- blocks ---------- */
  const card = (title, sub, ...kids) => el('section', { class: 'card' }, el('h2', {}, title, sub ? el('small', {}, sub) : null), ...kids);
  const packetNav = el('nav', { class: 'packet-nav', 'aria-label': 'Packet sections' }, el('span', { class: 'nav-label' }, 'Jump to:'));
  main.append(packetNav);
  const V = sheet.valuation || {};
  const fs = sheet.financial_snapshot || {};
  const m = x => x === null || x === undefined ? 'not derived' : (Math.abs(x) >= 1000 ? '$' + (x / 1000).toFixed(1) + ' bn' : '$' + x.toFixed(0) + ' m');
  let hintUsed = false;

  /* opening scene: Story-first card with 3 Plain-English Key Numbers, Investigations, and Bull vs. Bear quick toggle */
  let instinct = null; const askedQ = new Set();
  const heads = (sheet.source_handles || []).filter(h => h.masked_headline && h.available_at && h.available_at <= sheet.cutoff.slice(0, 10) && !/xbrl|company facts/i.test(h.masked_headline)).sort((a, b) => b.available_at.localeCompare(a.available_at)).slice(0, 3);
  const sc = sheet.scene; let sceneRead = !!sc;
  const hw = sheet.help_me_weigh;
  if (sc) {
    const scene = el('section', { class: 'card scene', id: 'sec-scene' }, el('h2', {}, 'Morning of ' + dateFmt(sheet.cutoff) + ' · ' + sc.setup_label));
    const q = el('p', { style: 'font-size:1.05rem;font-weight:500;margin:.6rem 0' }, sc.question);
    if (sc.setup === 'bad_news_headline') scene.append(el('blockquote', { style: 'margin:.4rem 0;padding:.5rem .8rem;border-left:3px solid var(--s2);font-weight:600' }, sc.voice));
    else if (sc.setup === 'analysts_disagree') { const parts = sc.voice.split(/\s(?=The other:)/); scene.append(el('p', {}, el('em', {}, parts[0])), parts[1] ? el('p', {}, el('em', {}, parts[1])) : null); }
    else scene.append(el('p', {}, el('em', {}, '“' + sc.voice + '”')));
    scene.append(q);

    /* 3 Plain-English Key Numbers right in the story card so non-finance & busy players get the gist in 10 seconds */
    const brief = el('div', { class: 'story-brief', 'aria-label': 'Key facts at a glance' });
    brief.append(el('div', { class: 'sb-tile' },
      el('div', { class: 'sb-label' }, '12-month stock move'),
      el('div', { class: 'sb-val ' + (market.returns['12m'] >= 0 ? 'up' : 'down') }, `${signed(market.returns['12m'])} at $${market.last_close.toFixed(2)}`),
      el('div', { class: 'sb-note' }, `S&P 500 ${signed(market.spy_returns['12m'])} · ${Math.abs(market.distance_from_trailing_252_high) < 0.01 ? 'at 12m high' : signed(market.distance_from_trailing_252_high) + ' from 12m high'}`)));
    if (V.status === 'derived' && V.market_cap_musd) {
      const vmode = (fs.presentation && fs.presentation.valuation_mode) || 'revenue';
      const subText = vmode === 'pipeline' && typeof V.net_cash_musd === 'number'
        ? `Net cash is ${(100 * V.net_cash_musd / V.market_cap_musd).toFixed(1)}% of market value (${m(V.net_cash_musd)})`
        : V.ev_to_revenue !== undefined ? `Enterprise value ${m(V.enterprise_value_musd)} (${Number(V.ev_to_revenue).toFixed(1)}× revenue)`
        : `Last full-year revenue ${m(V.annual_revenue_musd)}`;
      brief.append(el('div', { class: 'sb-tile' },
        el('div', { class: 'sb-label' }, 'Company valuation'),
        el('div', { class: 'sb-val' }, m(V.market_cap_musd) + ' market value'),
        el('div', { class: 'sb-note' }, subText)));
    }
    const h0 = (fs.headline || [])[0];
    const v0 = fs.presentation && fs.presentation.metrics && fs.presentation.metrics[0];
    if (h0) {
      brief.append(el('div', { class: 'sb-tile' },
        el('div', { class: 'sb-label' }, (v0 && v0.label) || h0.label),
        el('div', { class: 'sb-val' }, (v0 && v0.display_value) || money(h0.value, h0.unit)),
        el('div', { class: 'sb-note' }, h0.period ? `${h0.period}${h0.prior && h0.prior.value !== null && h0.prior.value !== undefined ? ' (prior ' + money(h0.prior.value, h0.unit) + ')' : ''}` : 'Latest reported period')));
    }
    scene.append(brief);

    if ((sc.ask_friend || []).length) {
      const askBox = el('div', { style: 'margin-top:.7rem' }, el('div', { class: 'note' }, el('strong', {}, sc.ask_label || 'Quick investigation — click to ask:')));
      const row = el('div', { class: 'row', style: 'margin:.35rem 0' }); const ans = el('div');
      sc.ask_friend.forEach((qa, i) => row.append(el('button', { type: 'button', class: 'ghost', 'aria-expanded': 'false', onclick: e => { const open = e.currentTarget.getAttribute('aria-expanded') === 'true'; [...row.children].forEach(b => b.setAttribute('aria-expanded', 'false')); ans.innerHTML = ''; if (!open) { e.currentTarget.setAttribute('aria-expanded', 'true'); ans.append(el('div', { class: 'card', style: 'margin:.4rem 0 0;background:var(--surface)' }, el('p', { style: 'margin:0' }, Psubtle(qa.a)))); askedQ.add(i); } } }, qa.q)));
      askBox.append(row, ans); scene.append(askBox);
    }
    if (hw) {
      const weighQuick = el('details', { style: 'margin-top:.6rem' }, el('summary', { class: 'note' }, el('strong', {}, '⚖️ Compare Bull vs. Bear arguments (plain-English summary)')));
      const wGrid = el('div', { class: 'story-brief', style: 'margin-top:.5rem' });
      for (const [k, lab] of [['own', '🟢 Case for buying'], ['flat', '⚪ Reason to wait'], ['short', '🔴 Case against']]) {
        if ((hw[k] || []).length) wGrid.append(el('div', { class: 'sb-tile' }, el('strong', { style: 'font-size:.85rem;display:block;margin-bottom:.3rem' }, lab), el('ul', { class: 'plain', style: 'font-size:.83rem;margin:0' }, ...hw[k].map(x => el('li', { style: 'margin:.25rem 0' }, Psubtle(x))))));
      }
      weighQuick.append(wGrid);
      weighQuick.addEventListener('toggle', () => { if (weighQuick.open) hintUsed = true; });
      scene.append(weighQuick);
    }
    const bizText = (transparent || (prior && !walkPending)) && reveal ? reveal.transparent.business_two_sentences : sheet.masked.business_two_sentences;
    if (bizText) {
      scene.append(el('details', { style: 'margin-top:.4rem' },
        el('summary', { class: 'note' }, el('strong', {}, '🏢 What this company actually does (2-sentence summary)')),
        el('p', { class: 'note', style: 'margin:.35rem 0 0;color:var(--ink)' }, Psubtle(bizText))));
    }
    const hasAssumptions = !campaignMode && (sc.assumptions || []).length > 0;
    scene.append(el('p', { class: 'note', style: 'margin:.6rem 0 0' }, 'You have enough above to make a call on the right, or browse the supporting data below.',
      hasAssumptions ? ' ' : null,
      hasAssumptions ? el('a', { href: '#ticket-assumptions', onclick: e => { e.preventDefault(); const t = document.getElementById('ticket-assumptions') || ticket; t.scrollIntoView({ behavior: 'smooth', block: 'center' }); const first = t.querySelector('input'); if (first) setTimeout(() => first.focus(), 350); } }, `Preview the ${sc.assumptions.length} assumptions in the decision ticket ↓`) : null));
    main.append(scene);
  }

  /* Collapsible Analyst Dossier toggle so the page is clean by default while keeping #main > section > h2 intact for tests and deep-dive readers */
  let dossierOpen = true;
  const dossierBtn = el('button', { type: 'button', class: 'ghost', style: 'width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding:.6rem .9rem;background:var(--surface)', 'aria-expanded': 'true' });
  const setDossierVis = open => {
    dossierOpen = open;
    dossierBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    dossierBtn.innerHTML = '';
    dossierBtn.append(
      el('span', {}, el('strong', {}, '📊 Analyst Dossier: Charts, Filings & Deep Dive'), el('span', { class: 'note', style: 'margin-left:.5rem' }, 'Price history, financials, sector tables & catalysts')),
      el('span', { class: 'badge' }, open ? 'Hide details ↑' : 'Expand details ↓')
    );
    for (const sec of main.querySelectorAll(':scope > section:not(#sec-scene)')) sec.hidden = !open;
  };
  dossierBtn.onclick = () => setDossierVis(!dossierOpen);
  main.append(dossierBtn);

  /* Fallback header card only if a case has no opening scene */
  if (!sc) {
    const wc0 = (sheet.what_changed || [])[0];
    main.append(el('section', { class: 'card', id: 'sec-question', style: 'border-left:4px solid var(--s1)' },
      el('h2', { style: 'font-size:1.15rem' }, sheet.neutral_title || 'The decision'),
      el('p', { style: 'font-size:1.02rem' }, P(sheet.player_question || '')),
      wc0 ? el('p', { class: 'note' }, el('strong', {}, 'Why now: '), P(wc0.fact)) : null));
    const bizCard = card('Business', null, el('p', {}, P((transparent || (prior && !walkPending)) && reveal ? reveal.transparent.business_two_sentences : sheet.masked.business_two_sentences)));
    bizCard.id = 'sec-business';
    main.append(bizCard);
  }

  /* market chart */
  const chartHost = el('div'); let span = years >= 3 ? 36 : 12;
  const spanBtns = el('div', { class: 'row', role: 'group', 'aria-label': 'Chart span' });
  const drawMarket = () => { const cut = new Date(market.last_eligible_session + 'T00:00:00Z'); cut.setUTCMonth(cut.getUTCMonth() - span); const from = cut.toISOString().slice(0, 10);
    const bars = market.bars.filter(b => b.d >= from), spy = market.spy.filter(b => b.d >= from);
    SG.lineChart(chartHost, [{ name: 'This stock', cls: 's1', points: bars.map(b => ({ d: b.d, v: b.c })) }, { name: 'S&P 500 (SPY)', cls: 's2', points: spy.map(b => ({ d: b.d, v: b.c })) }], { controls: true, rebase: true, volume: bars.map(b => ({ d: b.d, v: b.v })), label: 'Indexed to 100 at start of window (vs. S&P 500)', rawFmt: r => '$' + r.toFixed(2) }); };
  for (const m of [12, 36]) spanBtns.append(el('button', { class: 'ghost', type: 'button', 'aria-pressed': span === m ? 'true' : 'false', onclick: e => { span = m; [...spanBtns.children].forEach(b => b.setAttribute('aria-pressed', 'false')); e.target.setAttribute('aria-pressed', 'true'); drawMarket(); } }, m === 12 ? 'Past 12 months' : 'Past 3 years'));
  const lastClose = el('div', { class: 'row', style: 'gap:.75rem;margin:.5rem 0;align-items:baseline' },
    el('span', { class: 'note' }, 'Last close before cutoff:'),
    el('strong', { style: 'font-size:1.35rem;font-variant-numeric:tabular-nums' }, '$' + market.last_close.toFixed(2)),
    el('span', { class: 'note' }, 'on ' + dateFmt(market.last_eligible_session)));
  const mktCard = card('Market snapshot', 'price history to cutoff', lastClose, spanBtns, chartHost);
  mktCard.id = 'sec-market';
  main.append(mktCard);
  main.append(statsCard);
  drawMarket();

  /* what changed */
  const wcCard = card('What changed', 'key news before the cutoff', el('ul', { class: 'plain' }, ...(sheet.what_changed || []).map(w => el('li', { style: 'padding:.4rem 0' },
    el('div', {}, el('strong', {}, dateFmt(w.date) + ': '), P(w.fact)),
    w.relationship_to_business ? el('div', { class: 'note', style: 'margin-top:.15rem' }, '→ ', P(w.relationship_to_business)) : null))));
  wcCard.id = 'sec-changed';
  main.append(wcCard);

  /* financial snapshot */
  const humanUnit = u => u === 'USD_millions' ? '$M' : u === 'USD_billions' ? '$B' : u === 'USD_per_share' ? '$/share' : u === 'percent' ? '%' : (u === 'shares_millions' || u === 'millions_of_shares') ? 'M shares' : u === 'shares' ? 'shares' : (u || '');
  const kv = el('div', { class: 'kv' });
  for (const h of fs.headline || []) kv.append(el('div', {}, el('div', { class: 'l' }, h.label), el('div', { class: 'v' }, h.value === null || h.value === undefined ? 'not available' : money(h.value, h.unit)), el('div', { class: 'p' }, (h.period ? h.period : '') + (h.prior && h.prior.value !== null && h.prior.value !== undefined ? ' · vs ' + money(h.prior.value, h.unit) + ' (' + h.prior.period + ')' : '')), h.definition ? el('details', {}, el('summary', { class: 'note' }, 'definition'), el('div', { class: 'note' }, h.definition)) : null));
  const hist = el('table'); const histWrap = el('div');
  if ((fs.history || []).length) {
    const periods = [...new Set(fs.history.flatMap(r => r.cells.map(c => c.period)))];
    const isAnnual = per => /^FY\s?\d{4}|^\d{4}$|full[- ]year|^TTM|^LTM/i.test(String(per)); const isQuarter = per => /^Q[1-4]|quarter|^\dQ|9M|nine|6M|H[12]/i.test(String(per));
    const mixed = periods.some(isAnnual) && periods.some(isQuarter);
    const isStockRow = r => /cash|debt|share|assets|equity|investment|liabilit|deposit|loan|receivable|inventory|backlog|book value|balance/i.test(r.row);
    let perQuarter = false;
    const fmtCell = (v, unit, conv) => {
      if (v === null || v === undefined) return '—';
      if (typeof v !== 'number') return v;
      if (unit === 'shares' && Math.abs(v) >= 1e6) return (v / 1e6).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'M';
      return v.toLocaleString('en-US', { maximumFractionDigits: 2 });
    };
    const drawHist = () => { hist.innerHTML = '';
      hist.append(el('tr', {}, el('th', {}, 'Metric'), ...periods.map(p => el('th', { class: 'n' }, p + (perQuarter && isAnnual(p) ? ' (÷4)' : '')))));
      for (const r of fs.history) { const stock = isStockRow(r); const uLabel = humanUnit(r.unit);
        hist.append(el('tr', {}, el('td', {}, r.row, uLabel ? el('span', { class: 'muted' }, ' (' + uLabel + ')') : null), ...periods.map(p => { const c = r.cells.find(x => x.period === p); if (!c) return el('td', { class: 'n' }, '—');
          let v = c.value; const conv = perQuarter && isAnnual(p) && !stock && typeof v === 'number'; if (conv) v = v / 4;
          return el('td', { class: 'n', title: 'Filed ' + (c.available_at || '?') + (conv ? ' · annual divided by 4' : '') }, fmtCell(v, r.unit, conv)); }))); } };
    drawHist();
    if (location.hash === '#hist') setTimeout(() => { const d = histWrap.closest('details'); if (d) { d.open = true; d.scrollIntoView(); } }, 300);
    if (mixed) histWrap.append(el('label', { class: 'note', style: 'display:block;margin:.3rem 0' }, el('input', { type: 'checkbox', onchange: e => { perQuarter = e.target.checked; drawHist(); } }), ' Divide full-year (FY) income/cash-flow columns by 4 to compare against single quarters'));
    histWrap.append(el('div', { class: 'scroll' }, hist));
  }
  const vkv = el('div', { class: 'kv', style: 'margin-top:.75rem' });
  if (V.status === 'derived') {
    vkv.append(el('div', {}, el('div', { class: 'l' }, 'Market capitalization ', badge('derived')), el('div', { class: 'v' }, m(V.market_cap_musd)), el('div', { class: 'p' }, V.market_cap_formula)));
    if (V.enterprise_value_musd !== undefined) vkv.append(el('div', {}, el('div', { class: 'l' }, 'Enterprise value ', badge('derived')), el('div', { class: 'v' }, m(V.enterprise_value_musd)), el('div', { class: 'p' }, 'market cap ' + (V.net_cash_musd >= 0 ? 'minus net cash of ' : 'plus net debt of ') + m(Math.abs(V.net_cash_musd)))));
    if (V.annual_revenue_musd) vkv.append(el('div', {}, el('div', { class: 'l' }, (V.ev_to_revenue !== undefined ? 'EV / annual revenue ' : 'Market cap / annual revenue '), badge('derived')), el('div', { class: 'v' }, (V.ev_to_revenue !== undefined ? V.ev_to_revenue : V.market_cap_to_revenue) + 'x'), el('div', { class: 'p' }, 'revenue ' + m(V.annual_revenue_musd) + ', last full year filed before the cutoff')));
  }
  const vdet = el('details', {}, el('summary', { class: 'note' }, 'Valuation inputs and caveats'), el('ul', { class: 'plain' }, ...(V.inputs || []).map(i => el('li', { class: 'note' }, `${i.name}: ${i.value_millions !== undefined ? (i.name === 'shares' ? i.value_millions.toFixed(1) + ' m shares' : m(i.value_millions)) : ''} as of ${i.as_of || i.period || ''}${i.filed ? ', filed ' + i.filed : ''}${i.source ? ' [' + (Array.isArray(i.source) ? i.source.join(', ') : i.source) + ']' : ''}`)), ...(V.caveats || []).map(c => el('li', { class: 'note' }, 'Caveat: ' + c)), el('li', { class: 'note' }, V.note || V.reason || '')));
  if (fs.presentation) {
    const presentation = fs.presentation;
    const snapshot = card('Financial snapshot', 'key figures from filings');
    snapshot.classList.add('financial-snapshot');
