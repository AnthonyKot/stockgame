<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockgame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>
<main class="wrap">
  <h2>Play a historical decision</h2>
  <p class="note">Each case freezes the public record at a dated cutoff. You read what an investor could have read then, make a call, and see what followed. Names are hidden until you commit unless transparent mode is on. <a href="#rules">How a case works</a>.</p>
  <div id="rules"></div>
  <div id="list" class="list" aria-live="polite">Loading cases…</div>
</main>
<script src="app.js"></script>
<script>
(async () => {
  document.getElementById('top').replaceWith(SG.topbar('play'));
  const rs = SG.rulesSection();
  const rulesDet = SG.el('details', { class: 'card', id: 'rules', style: 'margin:.5rem 0 .75rem' },
    SG.el('summary', { style: 'cursor:pointer;font-size:.95rem' },
      SG.el('strong', {}, 'How a case works '),
      SG.el('span', { class: 'note' }, '· 3-step loop & simulation fill rules (click to expand)')));
  rs.classList.remove('card'); rs.removeAttribute('id'); rs.style.margin = '.5rem 0 0'; rs.style.padding = '0'; rs.style.border = '0';
  const rHeading = rs.querySelector('h3'); if (rHeading) rHeading.remove();
  rulesDet.append(rs);
  document.getElementById('rules').replaceWith(rulesDet);
  const list = document.getElementById('list');
  try {
    const idx = await SG.load('data/index.json');
    list.innerHTML = '';
    const j = SG.journal();
    const ready = idx.cases.filter(c => c.status === 'sheet_ready');
    const decided = ready.filter(c => j.find(x => x.case_id === c.id));
    const next = ready.find(c => !j.find(x => x.case_id === c.id));

    /* Side-by-side mode comparison: Standalone Cases vs. 3-Story Campaign */
    const starterPicks = [
      { id: '050a03b08f', tag: '🟢 Everyday retail · 3y', title: 'Big-box retailer after a surge', hook: 'Sales jumped 11% in lockdown, but costs soared and management suspended guidance.' },
      { id: '4219766e75', tag: '🟢 Consumer snacks · 1y', title: 'Chocolate & snacks pricing test', hook: 'Prices went up 8% and shoppers kept buying. Can margins hold as cocoa costs rise?' },
      { id: '5e3e9193b7', tag: '🏦 Major US bank · 5y', title: 'Record profit at peak rates', hook: 'The largest US bank just earned $15B in a quarter—right as rate cuts loom.' }
    ];
    const starterBox = SG.el('div', { style: 'margin-top:.55rem;padding-top:.55rem;border-top:1px solid var(--border)' },
      SG.el('div', { class: 'note', style: 'font-weight:600;color:var(--ink)' }, '👋 New here? Start with a familiar everyday business (no deep finance required):'),
      SG.el('div', { class: 'starter-strip' }, ...starterPicks.map(p => {
        const isDone = j.find(x => x.case_id === p.id);
        return SG.el('a', { href: `play.html?case=${p.id}#sec-scene` },
          SG.el('div', { class: 'st-tag' }, p.tag + (isDone ? ' · ✓ decided' : '')),
          SG.el('div', { class: 'st-title' }, p.title),
          SG.el('div', { class: 'st-sub' }, p.hook));
      })));

    const standaloneCard = SG.el('div', { class: 'card mode-card', style: 'border-left:4px solid var(--s1)' },
      SG.el('div', {},
        SG.el('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:.2rem' },
          SG.el('h3', { style: 'margin:0' }, 'Standalone Cases'),
          SG.badge(`${decided.length} of ${ready.length} decided`)),
        SG.el('div', { class: 'note' }, decided.length
          ? `${ready.length - decided.length} undecided remaining. Each case is an independent $100,000 call with a 1-screen story brief, 2-click decision ticket, and dated debrief.`
          : '10 real historical moments. Read the 1-minute story brief, pick Buy, Pass, or Short, and see which real company it was.'),
        starterBox),
      SG.el('div', { class: 'mode-actions' },
        next ? SG.el('a', { href: 'play.html?case=' + next.id + '#sec-scene', class: 'btn-link' }, decided.length ? 'Continue: next undecided case' : 'Start with a familiar retailer →')
             : SG.el('a', { href: 'journal.html', class: 'btn-link' }, 'All decided: open the journal'),
        decided.length && next ? SG.el('a', { href: 'journal.html', class: 'btn-link ghost' }, 'Open journal') : null));

    const campaignCard = SG.el('div', { class: 'card mode-card' },
      SG.el('div', {},
        SG.el('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:.2rem' },
          SG.el('h3', { style: 'margin:0' }, 'Connected Campaign'),
          SG.badge('prototype · 3 stories')),
        SG.el('div', { class: 'note' }, 'Start in February 2018 with $100,000 cash and 1 Bitcoin, meet three chronological stories in one shared account, and advance the clock until your last timed trade closes. Separate from your standalone journal.')),
      SG.el('div', { class: 'mode-actions' },
        SG.el('a', { href: 'campaign.html', class: 'btn-link ghost' }, 'Play the campaign')));

    const modeGrid = SG.el('div', { class: 'mode-grid', role: 'region', 'aria-label': 'Game modes' }, standaloneCard, campaignCard);
    document.getElementById('rules').before(modeGrid);

    /* Filter controls for the 10 standalone cases */
    const state = { status: 'all', cat: 'all', setup: 'all', horizon: 'all' };
    const setups = [...new Set(idx.cases.map(c => c.setup).filter(Boolean))];
    const horizons = [...new Set(idx.cases.map(c => c.horizon && String(c.horizon.count)).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
    const setupShort = s => /headline/i.test(s) ? 'Bad-news headline' : /disagree/i.test(s) ? 'Analysts disagree' : /stay away/i.test(s) ? 'Stay-away warning' : /tip/i.test(s) ? 'Friend’s stock tip' : /familiar/i.test(s) ? 'Familiar product' : s.replace(/\.$/, '');
    const catOf = c => /biotech|pharma/i.test(c.sector_hint || '') ? 'biotech' : /retail|consumer/i.test(c.sector_hint || '') ? 'everyday' : 'finance_ind';
    const catBadgeText = cat => cat === 'everyday' ? '🟢 Everyday business' : cat === 'biotech' ? '🔬 Biotech trial' : '🏦 Finance & Industrials';

    const filterBar = SG.el('div', { class: 'filter-bar', role: 'region', 'aria-label': 'Filter cases' });
    const countNote = SG.el('span', { class: 'note', style: 'margin-left:auto' });
    const rows = [];

    const applyFilters = () => {
      let shown = 0;
      for (const item of rows) {
        const matchStatus = state.status === 'all' || (state.status === 'decided' ? item.done : !item.done);
        const matchCat = state.cat === 'all' || item.cat === state.cat;
        const matchSetup = state.setup === 'all' || item.setup === state.setup;
        const matchHz = state.horizon === 'all' || item.hz === state.horizon;
        const vis = matchStatus && matchCat && matchSetup && matchHz;
        item.node.hidden = !vis;
        if (vis) shown++;
      }
      countNote.textContent = shown === rows.length ? `Showing all ${rows.length} cases` : `Showing ${shown} of ${rows.length} cases`;
    };

    const makeGroup = (label, key, opts) => {
      const g = SG.el('div', { class: 'filter-group', role: 'group', 'aria-label': label }, SG.el('span', { class: 'filter-label' }, label + ':'));
      for (const [val, text] of opts) {
        g.append(SG.el('button', { type: 'button', class: 'ghost', 'aria-pressed': state[key] === val ? 'true' : 'false', onclick: e => {
          state[key] = val;
          [...g.querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', 'false'));
          e.currentTarget.setAttribute('aria-pressed', 'true');
          applyFilters();
        } }, text));
      }
      return g;
    };

    filterBar.append(
      makeGroup('Status', 'status', [['all', `All (${ready.length})`], ['undecided', `Undecided (${ready.length - decided.length})`], ['decided', `Decided (${decided.length})`]]),
      makeGroup('Business type', 'cat', [['all', 'All types'], ['everyday', '🟢 Everyday business'], ['finance_ind', '🏦 Finance & Industrials'], ['biotech', '🔬 Biotech trial']]),
      makeGroup('Setup', 'setup', [['all', 'All setups'], ...setups.map(s => [s, setupShort(s)])]),
      makeGroup('Default horizon', 'horizon', [['all', 'Any'], ...horizons.map(h => [h, h + 'y'])]),
      countNote
    );
    list.before(filterBar);

    for (const c of idx.cases) {
      const done = j.find(x => x.case_id === c.id);
      const isReady = c.status === 'sheet_ready';
      const hzCount = c.horizon ? String(c.horizon.count) : '';
      const cat = catOf(c);
      const resText = done && done.result && typeof done.result.portfolio_return === 'number' ? ` · portfolio ${SG.signed(done.result.portfolio_return)}` : '';
      const a = SG.el('a', { href: isReady ? 'play.html?case=' + c.id : null, 'aria-disabled': isReady ? null : 'true', tabindex: isReady ? null : '-1', style: isReady ? '' : 'opacity:.55' },
        SG.el('div', { class: 't' },
          isReady ? (c.title || c.alias || 'Unnamed case') : 'Case not ready (sheet missing)',
          SG.el('span', { class: 'case-meta-pills' },
            SG.badge(catBadgeText(cat)),
            c.setup ? SG.badge(setupShort(c.setup)) : null,
            done ? SG.badge('decided') : null)),
        SG.el('div', { class: 's' },
          (c.setup ? c.setup + ' · ' : '') + SG.dateFmt(c.cutoff) + ' · ' + SG.horizonText(c.horizon).replace(' calendar', '') + ' · ' + ((done && done.reveal_name) ? done.reveal_name : (c.alias || '')) + (done ? ' · your call: ' + done.action + (done.size ? ' ' + done.size + '%' : '') + resText : '')));
      list.append(a);
      rows.push({ node: a, done: !!done, cat, setup: c.setup || '', hz: hzCount });
    }
    applyFilters();
    if (!idx.cases.length) list.textContent = 'No cases built yet. Run scripts/build_bundles.py.';
  } catch (e) { list.textContent = 'Could not load data/index.json (' + e.message + '). Serve the site folder over HTTP.'; }
})();
</script>
</body>
</html>
